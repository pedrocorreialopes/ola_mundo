

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olá Mundo Estiloso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .animate-float {
            animation: float 8s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        .text-gradient {
            background: linear-gradient(to right, #fff, #c7d2fe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .card {
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .btn {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn:after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        
        .btn:hover:after {
            left: 100%;
        }
    </style>
</head>
<body>
    <!-- Círculos decorativos de fundo -->
    <div class="circle animate-float" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="circle animate-float" style="width: 200px; height: 200px; top: 60%; left: 15%; animation-delay: 1s;"></div>
    <div class="circle animate-float" style="width: 150px; height: 150px; top: 30%; left: 70%; animation-delay: 2s;"></div>
    <div class="circle animate-float" style="width: 250px; height: 250px; top: 70%; left: 80%; animation-delay: 3s;"></div>
    
    <!-- Conteúdo principal -->
    <div class="flex items-center justify-center h-screen px-4">
        <div class="card rounded-2xl p-8 md:p-12 max-w-3xl w-full text-center">
            <h1 class="text-5xl md:text-7xl font-bold mb-6 text-gradient">Olá Mundo!</h1>
            <p class="text-white text-xl md:text-2xl mb-8 opacity-90">Bem-vindo à minha página estilosa.</p>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div class="bg-white/10 p-6 rounded-xl">
                    <div class="text-4xl mb-3">✨</div>
                    <h3 class="text-white text-xl font-semibold mb-2">Elegante</h3>
                    <p class="text-white/80">Design moderno com efeitos visuais impressionantes</p>
                </div>
                <div class="bg-white/10 p-6 rounded-xl">
                    <div class="text-4xl mb-3">🚀</div>
                    <h3 class="text-white text-xl font-semibold mb-2">Rápido</h3>
                    <p class="text-white/80">Performance otimizada para uma experiência fluida</p>
                </div>
                <div class="bg-white/10 p-6 rounded-xl">
                    <div class="text-4xl mb-3">📱</div>
                    <h3 class="text-white text-xl font-semibold mb-2">Responsivo</h3>
                    <p class="text-white/80">Adaptado para todos os tamanhos de tela</p>
                </div>
            </div>
            
            <button id="btnSurpresa" class="btn bg-white/20 hover:bg-white/30 text-white font-semibold py-3 px-8 rounded-full">
                Clique para Surpresa
            </button>
        </div>
    </div>
    
    <script>
        document.getElementById('btnSurpresa').addEventListener('click', function() {
            // Criar confetes
            for (let i = 0; i < 100; i++) {
                createConfetti();
            }
            
            // Mudar o texto do botão
            this.textContent = "Incrível! 🎉";
            
            // Restaurar após 3 segundos
            setTimeout(() => {
                this.textContent = "Clique para Surpresa";
            }, 3000);
        });
        
        function createConfetti() {
            const confetti = document.createElement('div');
            confetti.style.position = 'absolute';
            confetti.style.width = Math.random() * 10 + 5 + 'px';
            confetti.style.height = Math.random() * 10 + 5 + 'px';
            confetti.style.backgroundColor = getRandomColor();
            confetti.style.borderRadius = '50%';
            confetti.style.zIndex = '1000';
            
            // Posição inicial
            const startX = window.innerWidth / 2;
            const startY = window.innerHeight / 2;
            
            confetti.style.left = startX + 'px';
            confetti.style.top = startY + 'px';
            
            document.body.appendChild(confetti);
            
            // Animação
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 5 + 3;
            const vx = Math.cos(angle) * velocity;
            const vy = Math.sin(angle) * velocity;
            
            let x = startX;
            let y = startY;
            let opacity = 1;
            
            const animate = () => {
                x += vx;
                y += vy - 0.5; // Gravidade
                opacity -= 0.01;
                
                confetti.style.left = x + 'px';
                confetti.style.top = y + 'px';
                confetti.style.opacity = opacity;
                
                if (opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    document.body.removeChild(confetti);
                }
            };
            
            requestAnimationFrame(animate);
        }
        
        function getRandomColor() {
            const colors = ['#FF5252', '#FF4081', '#E040FB', '#7C4DFF', '#536DFE', '#448AFF', '#40C4FF', '#18FFFF', '#64FFDA', '#69F0AE', '#B2FF59', '#EEFF41', '#FFFF00', '#FFD740', '#FFAB40', '#FF6E40'];
            return colors[Math.floor(Math.random() * colors.length)];
        }
    </script>

</html>
